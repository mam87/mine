<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة المهام — Formalin Detector</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ===== VARIABLES ===== */
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2128;
  --border: #21262d;
  --accent: #f0883e;
  --accent2: #58a6ff;
  --text: #e6edf3;
  --muted: #8b949e;
  --pending: #d29922;
  --done: #3fb950;
  --inprog: #58a6ff;
  --cancelled: #f85149;
  --danger: #f85149;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  padding: 28px 20px 60px;
}

/* ===== HEADER ===== */
.header {
  text-align: center;
  margin-bottom: 32px;
  animation: fadeDown 0.5s ease both;
}
.header h1 {
  font-size: 2rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 5px; }
.tag {
  display: inline-block;
  background: #21262d;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 20px;
  padding: 2px 14px;
  font-size: 0.72rem;
  margin-top: 8px;
  letter-spacing: 1px;
}

/* ===== TOOLBAR ===== */
.toolbar {
  max-width: 1060px;
  margin: 0 auto 18px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  animation: fadeUp 0.5s ease 0.1s both;
}
.toolbar-left { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.toolbar-right { display: flex; gap: 8px; }

.search-box {
  flex: 1;
  min-width: 180px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  font-size: 0.88rem;
  outline: none;
  transition: border 0.2s;
  text-align: right;
}
.search-box:focus { border-color: var(--accent2); }
.search-box::placeholder { color: #484f58; }

.filter-select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  font-size: 0.85rem;
  outline: none;
  cursor: pointer;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  font-family: 'Cairo', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  white-space: nowrap;
}
.btn:hover { opacity: 0.85; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost   { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-print   { background: #21262d; color: var(--accent2); border: 1px solid var(--accent2); }
.btn-danger  { background: rgba(248,81,73,0.15); color: var(--danger); border: 1px solid rgba(248,81,73,0.3); }

/* ===== STATS ===== */
.stats {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 28px;
  flex-wrap: wrap;
  animation: fadeUp 0.5s ease 0.15s both;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 22px;
  text-align: center;
  min-width: 90px;
  transition: transform 0.2s;
}
.stat-card:hover { transform: translateY(-2px); }
.stat-card .num { font-size: 1.7rem; font-weight: 900; }
.stat-card .label { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.stat-card.total   .num { color: var(--accent2); }
.stat-card.pending .num { color: var(--pending); }
.stat-card.inprog  .num { color: var(--inprog); }
.stat-card.done    .num { color: var(--done); }

/* ===== PROGRESS BAR ===== */
.progress-wrap {
  max-width: 1060px;
  margin: 0 auto 24px;
  animation: fadeUp 0.5s ease 0.2s both;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 6px;
}
.progress-bar-bg {
  background: var(--surface);
  border-radius: 99px;
  height: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.progress-bar-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--done), #58a6ff);
  transition: width 0.5s ease;
}

/* ===== TABLE ===== */
.table-wrap {
  max-width: 1060px;
  margin: 0 auto;
  animation: fadeUp 0.5s ease 0.25s both;
  overflow-x: auto;
}
table { width: 100%; border-collapse: separate; border-spacing: 0 7px; min-width: 640px; }

thead th {
  background: #21262d;
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 10px 14px;
  text-align: right;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
thead th:first-child { border-radius: 8px 0 0 8px; width: 44px; }
thead th:last-child  { border-radius: 0 8px 8px 0; width: 100px; }

tbody tr {
  background: var(--surface);
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
}
tbody tr:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
tbody tr.hidden-row { display: none; }

tbody td {
  padding: 12px 14px;
  font-size: 0.9rem;
  vertical-align: middle;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
tbody td:first-child {
  border-right: 1px solid var(--border);
  border-radius: 0 10px 10px 0;
  text-align: center;
}
tbody td:last-child {
  border-left: 1px solid var(--border);
  border-radius: 10px 0 0 10px;
  text-align: center;
}

.task-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #c96b00);
  color: #fff; font-size: 0.75rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto;
}

.task-title {
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  cursor: pointer;
}
.task-title:hover { color: var(--accent); }
.task-note { font-size: 0.76rem; color: var(--muted); margin-top: 3px; }

/* inline edit inputs */
.inline-edit {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 3px 7px;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  font-size: 0.88rem;
  font-weight: 700;
  width: 100%;
  outline: none;
  transition: border 0.2s, background 0.2s;
  text-align: right;
}
.inline-edit:focus {
  border-color: var(--accent);
  background: rgba(240,136,62,0.05);
}
.inline-note {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 2px 7px;
  color: var(--muted);
  font-family: 'Cairo', sans-serif;
  font-size: 0.75rem;
  width: 100%;
  outline: none;
  transition: border 0.2s;
  text-align: right;
  margin-top: 2px;
}
.inline-note:focus {
  border-color: var(--border);
  background: rgba(255,255,255,0.03);
  color: var(--text);
}
.inline-note::placeholder, .inline-edit::placeholder { color: #484f58; }

/* status badge */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.74rem;
  font-weight: 600;
  white-space: nowrap;
}
.badge.pending   { background: rgba(210,153,34,0.15); color: var(--pending);   border: 1px solid rgba(210,153,34,0.3); }
.badge.done      { background: rgba(63,185,80,0.15);  color: var(--done);      border: 1px solid rgba(63,185,80,0.3); }
.badge.inprog    { background: rgba(88,166,255,0.15); color: var(--inprog);    border: 1px solid rgba(88,166,255,0.3); }
.badge.cancelled { background: rgba(248,81,73,0.15);  color: var(--cancelled); border: 1px solid rgba(248,81,73,0.3); }

.status-select {
  background: transparent; border: none;
  color: inherit; font-family: 'Cairo', sans-serif;
  font-size: 0.74rem; font-weight: 600;
  cursor: pointer; outline: none; width: 100%;
}

/* priority */
.priority-select {
  background: transparent; border: none;
  font-family: 'Cairo', sans-serif; font-size: 0.82rem;
  cursor: pointer; outline: none; padding: 2px 4px;
  border-radius: 4px; transition: background 0.2s;
}
.priority-select:hover { background: var(--surface2); }
.priority-select option { background: var(--surface); }

/* action buttons */
.action-btns { display: flex; gap: 6px; justify-content: center; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface2); color: var(--muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; transition: all 0.2s;
}
.icon-btn:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(88,166,255,0.08); }
.icon-btn.del:hover { border-color: var(--danger); color: var(--danger); background: rgba(248,81,73,0.08); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  width: 100%;
  max-width: 480px;
  transform: translateY(20px);
  transition: transform 0.25s;
  position: relative;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal h2 {
  font-size: 1.2rem; font-weight: 800;
  margin-bottom: 20px;
  color: var(--accent);
}
.form-group { margin-bottom: 14px; }
.form-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 13px;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  font-size: 0.9rem;
  outline: none;
  transition: border 0.2s;
  text-align: right;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 72px; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-start; }
.modal-close {
  position: absolute; top: 16px; left: 16px;
  background: none; border: none; color: var(--muted);
  font-size: 1.2rem; cursor: pointer; transition: color 0.2s;
}
.modal-close:hover { color: var(--text); }

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center; padding: 48px 20px;
  color: var(--muted); font-size: 0.9rem;
}
.empty-state svg { opacity: 0.2; margin-bottom: 12px; }

/* ===== FOOTER ===== */
.footer {
  text-align: center; margin-top: 36px;
  color: var(--muted); font-size: 0.76rem;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes rowIn {
  from { opacity: 0; transform: translateX(10px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ===== PRINT STYLES ===== */
@media print {
  body { background: #fff !important; color: #000 !important; padding: 0; }
  .toolbar, .modal-overlay, .icon-btn, .btn, .action-btns,
  .progress-wrap, .footer, .status-select, .priority-select { display: none !important; }

  .header h1 {
    -webkit-text-fill-color: #333 !important;
    background: none !important;
    color: #333 !important;
    font-size: 1.5rem;
  }
  .header .subtitle { color: #666; }
  .tag { border-color: #999; color: #666; }

  .stat-card { border: 1px solid #ddd !important; background: #f9f9f9 !important; }
  .stat-card .num { color: #333 !important; }
  .stat-card .label { color: #666 !important; }

  table { border-spacing: 0 4px; }
  thead th {
    background: #f0f0f0 !important; color: #555 !important;
    border-bottom: 2px solid #ddd;
  }
  tbody tr { background: #fafafa !important; box-shadow: none !important; }
  tbody td {
    border-color: #e0e0e0 !important;
    color: #222 !important;
    padding: 9px 12px !important;
  }
  .task-num { background: #e0e0e0 !important; color: #333 !important; }
  .task-title { color: #111 !important; }
  .task-note { color: #555 !important; }
  .badge { border: 1px solid #ccc !important; }
  .badge.pending   { background: #fff8e1 !important; color: #b38600 !important; }
  .badge.done      { background: #e8f5e9 !important; color: #2e7d32 !important; }
  .badge.inprog    { background: #e3f2fd !important; color: #1565c0 !important; }
  .badge.cancelled { background: #fce4e4 !important; color: #c62828 !important; }
  .inline-edit, .inline-note { border: none !important; background: transparent !important; }

  .progress-bar-bg { border: 1px solid #ddd; }
  .progress-bar-fill { background: #4caf50 !important; }
}

@media (max-width: 600px) {
  .header h1 { font-size: 1.5rem; }
  .stat-card { padding: 10px 14px; min-width: 70px; }
  .stat-card .num { font-size: 1.3rem; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1>متابعة المهام</h1>
  <div class="subtitle">Task Follow-up — Formalin Detector Project</div>
  <span class="tag">FORMALIN DETECTOR</span>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat-card total">  <div class="num" id="s-total">0</div>  <div class="label">إجمالي</div></div>
  <div class="stat-card pending"><div class="num" id="s-pending">0</div><div class="label">قيد الانتظار</div></div>
  <div class="stat-card inprog"> <div class="num" id="s-inprog">0</div> <div class="label">جارٍ</div></div>
  <div class="stat-card done">   <div class="num" id="s-done">0</div>   <div class="label">مكتمل</div></div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="progress-label">
    <span>نسبة الإنجاز</span>
    <span id="pct-label">0%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="toolbar-left">
    <input class="search-box" id="searchBox" type="text" placeholder="🔍  ابحث عن مهمة...">
    <select class="filter-select" id="filterStatus" onchange="applyFilter()">
      <option value="">كل الحالات</option>
      <option value="pending">قيد الانتظار</option>
      <option value="inprog">جارٍ</option>
      <option value="done">مكتمل</option>
      <option value="cancelled">ملغى</option>
    </select>
    <select class="filter-select" id="filterPriority" onchange="applyFilter()">
      <option value="">كل الأولويات</option>
      <option value="high">عالية 🔴</option>
      <option value="med">متوسطة 🟡</option>
      <option value="low">منخفضة 🟢</option>
    </select>
  </div>
  <div class="toolbar-right">
    <button class="btn btn-primary" onclick="openModal()">＋ مهمة جديدة</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ طباعة</button>
  </div>
</div>

<!-- TABLE -->
<div class="table-wrap">
  <table id="taskTable">
    <thead>
      <tr>
        <th>#</th>
        <th>المهمة / الوصف</th>
        <th style="min-width:100px">الأولوية</th>
        <th style="min-width:140px">الحالة</th>
        <th style="min-width:160px">ملاحظات</th>
        <th>إجراء</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none">
    <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    </svg>
    <div>لا توجد مهام مطابقة</div>
  </div>
</div>

<div class="footer">آخر تحديث: <span id="dateNow"></span></div>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 id="modalTitle">➕ إضافة مهمة جديدة</h2>
    <div class="form-group">
      <label class="form-label">عنوان المهمة *</label>
      <input class="form-input" id="f-title" type="text" placeholder="أدخل عنوان المهمة...">
    </div>
    <div class="form-group">
      <label class="form-label">وصف / ملاحظة</label>
      <input class="form-input" id="f-note" type="text" placeholder="وصف إضافي اختياري...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">الأولوية</label>
        <select class="form-select" id="f-priority">
          <option value="high">🔴 عالية</option>
          <option value="med" selected>🟡 متوسطة</option>
          <option value="low">🟢 منخفضة</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">الحالة</label>
        <select class="form-select" id="f-status">
          <option value="pending" selected>قيد الانتظار</option>
          <option value="inprog">جارٍ</option>
          <option value="done">مكتمل ✓</option>
          <option value="cancelled">ملغى</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظات المتابعة</label>
      <textarea class="form-textarea" id="f-remarks" placeholder="ملاحظات..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveTask()">💾 حفظ</button>
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script>
/* ===========================
   DATA
=========================== */
let tasks = [
  { id:1, title:"إجتماع مع مرحلة بهواء وشغل (حماية)",    note:"إسبرام + بسرعة + الجودة + ديسبنسر", priority:"high", status:"pending",   remarks:"" },
  { id:2, title:"عطاء غطاء — Slide → Printer",             note:"هيثم",                               priority:"med",  status:"pending",   remarks:"" },
  { id:3, title:"عطاء غطاء — Cassette-Printer",            note:"هيثم",                               priority:"med",  status:"pending",   remarks:"" },
  { id:4, title:"عطاء غطاء الكواسفة / هيم الوصي",         note:"",                                   priority:"med",  status:"pending",   remarks:"" },
  { id:5, title:"عطاء مواد — Dispenser + Forceps",         note:"",                                   priority:"high", status:"pending",   remarks:"" },
  { id:6, title:"جرد مواد أمسكي",                          note:"",                                   priority:"low",  status:"pending",   remarks:"" },
  { id:7, title:"عطاء — External Control ← م كـ بنار",    note:"",                                   priority:"high", status:"pending",   remarks:"" },
  { id:8, title:"عطاء الـ Masks",                          note:"",                                   priority:"low",  status:"cancelled", remarks:"تم إلغاؤه" }
];
let nextId = 9;
let editingIdx = null;

const priorityMap = {
  high: { label:"🔴 عالية",     cls:"p-high" },
  med:  { label:"🟡 متوسطة",   cls:"p-med"  },
  low:  { label:"🟢 منخفضة",   cls:"p-low"  }
};
const statusMap = {
  pending:   { label:"قيد الانتظار", cls:"pending"   },
  inprog:    { label:"جارٍ",         cls:"inprog"    },
  done:      { label:"مكتمل ✓",      cls:"done"      },
  cancelled: { label:"ملغى",         cls:"cancelled" }
};

/* ===========================
   RENDER
=========================== */
function render() {
  const q  = document.getElementById('searchBox').value.trim().toLowerCase();
  const fs = document.getElementById('filterStatus').value;
  const fp = document.getElementById('filterPriority').value;
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let visible = 0;

  tasks.forEach((task, i) => {
    const matchQ  = !q  || task.title.toLowerCase().includes(q) || task.note.toLowerCase().includes(q) || task.remarks.toLowerCase().includes(q);
    const matchS  = !fs || task.status   === fs;
    const matchP  = !fp || task.priority === fp;
    if (!matchQ || !matchS || !matchP) return;
    visible++;

    const s = statusMap[task.status];
    const p = priorityMap[task.priority];
    const tr = document.createElement('tr');
    tr.style.animation = 'rowIn 0.3s ease both';
    tr.style.animationDelay = (visible * 0.04) + 's';
    tr.innerHTML = `
      <td><div class="task-num">${task.id}</div></td>
      <td style="min-width:200px">
        <input class="inline-edit" value="${esc(task.title)}" placeholder="عنوان المهمة"
          onchange="tasks[${i}].title=this.value" >
        <input class="inline-note" value="${esc(task.note)}"  placeholder="وصف اختياري..."
          onchange="tasks[${i}].note=this.value" >
      </td>
      <td>
        <select class="priority-select" onchange="tasks[${i}].priority=this.value;updateStats()">
          <option value="high" ${task.priority==='high'?'selected':''}>🔴 عالية</option>
          <option value="med"  ${task.priority==='med' ?'selected':''}>🟡 متوسطة</option>
          <option value="low"  ${task.priority==='low' ?'selected':''}>🟢 منخفضة</option>
        </select>
      </td>
      <td>
        <div class="badge ${s.cls}">
          <select class="status-select" onchange="changeStatus(${i},this.value)">
            <option value="pending"   ${task.status==='pending'  ?'selected':''}>قيد الانتظار</option>
            <option value="inprog"    ${task.status==='inprog'   ?'selected':''}>جارٍ</option>
            <option value="done"      ${task.status==='done'     ?'selected':''}>مكتمل ✓</option>
            <option value="cancelled" ${task.status==='cancelled'?'selected':''}>ملغى</option>
          </select>
        </div>
      </td>
      <td>
        <input class="inline-note" style="font-size:0.82rem;color:var(--text)"
          value="${esc(task.remarks)}" placeholder="أضف ملاحظة متابعة..."
          onchange="tasks[${i}].remarks=this.value">
      </td>
      <td>
        <div class="action-btns">
          <button class="icon-btn" title="تحرير" onclick="openModal(${i})">✏️</button>
          <button class="icon-btn del" title="حذف" onclick="deleteTask(${i})">🗑</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('emptyState').style.display = visible === 0 ? 'block' : 'none';
  updateStats();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ===========================
   STATS & PROGRESS
=========================== */
function updateStats() {
  const c = { pending:0, inprog:0, done:0, cancelled:0 };
  tasks.forEach(t => c[t.status]++);
  document.getElementById('s-total').textContent   = tasks.length;
  document.getElementById('s-pending').textContent = c.pending;
  document.getElementById('s-inprog').textContent  = c.inprog;
  document.getElementById('s-done').textContent    = c.done;

  const active = tasks.filter(t => t.status !== 'cancelled').length;
  const pct = active === 0 ? 0 : Math.round((c.done / active) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('pct-label').textContent = pct + '%';
}

/* ===========================
   ACTIONS
=========================== */
function changeStatus(idx, val) {
  tasks[idx].status = val;
  updateStats();
  render();
}

function deleteTask(idx) {
  if (!confirm('هل تريد حذف هذه المهمة؟')) return;
  tasks.splice(idx, 1);
  render();
}

function applyFilter() { render(); }

document.getElementById('searchBox').addEventListener('input', render);

/* ===========================
   MODAL
=========================== */
function openModal(idx = null) {
  editingIdx = idx;
  const overlay = document.getElementById('modalOverlay');
  if (idx !== null) {
    const t = tasks[idx];
    document.getElementById('modalTitle').textContent = '✏️ تحرير المهمة';
    document.getElementById('f-title').value    = t.title;
    document.getElementById('f-note').value     = t.note;
    document.getElementById('f-priority').value = t.priority;
    document.getElementById('f-status').value   = t.status;
    document.getElementById('f-remarks').value  = t.remarks;
  } else {
    document.getElementById('modalTitle').textContent = '➕ إضافة مهمة جديدة';
    document.getElementById('f-title').value    = '';
    document.getElementById('f-note').value     = '';
    document.getElementById('f-priority').value = 'med';
    document.getElementById('f-status').value   = 'pending';
    document.getElementById('f-remarks').value  = '';
  }
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 200);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingIdx = null;
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function saveTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('عنوان المهمة مطلوب'); return; }
  const obj = {
    id:       editingIdx !== null ? tasks[editingIdx].id : nextId++,
    title,
    note:     document.getElementById('f-note').value.trim(),
    priority: document.getElementById('f-priority').value,
    status:   document.getElementById('f-status').value,
    remarks:  document.getElementById('f-remarks').value.trim()
  };
  if (editingIdx !== null) {
    tasks[editingIdx] = obj;
  } else {
    tasks.push(obj);
  }
  closeModal();
  render();
}

/* keyboard shortcut: Escape */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'p') { e.preventDefault(); window.print(); }
});

/* ===========================
   INIT
=========================== */
document.getElementById('dateNow').textContent =
  new Date().toLocaleDateString('ar-EG', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

render();
</script>
</body>
</html>
