<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Timeline Simulator - AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-blue: #00f3ff;
            --glitch-red: #ff003c;
            --bg-black: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-black);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 9:16 Mobile Aspect Ratio Container */
        #tiktok-canvas {
            width: 100vw;
            height: 100vh;
            max-width: 450px; /* Simulated Mobile View */
            max-height: 800px;
            position: relative;
            border: 2px solid #222;
            overflow: hidden;
            background: radial-gradient(circle, #111 0%, #000 100%);
        }

        /* Scanning Line Effect */
        .scanner {
            position: absolute;
            width: 100%;
            height: 4px;
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 15px var(--neon-green);
            top: 0;
            z-index: 10;
            animation: scan 3s linear infinite;
        }

        /* Neural Network Background (Particles) */
        #matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
        }

        /* HUD Elements */
        .hud-corner {
            position: absolute;
            font-size: 10px;
            padding: 10px;
            text-transform: uppercase;
        }
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; color: var(--neon-blue); }
        .bottom-left { bottom: 0; left: 0; }

        /* Content Styles */
        .event-container {
            position: absolute;
            width: 80%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }

        .image-box {
            width: 100%;
            height: 250px;
            background: #111;
            border: 1px solid var(--neon-green);
            position: relative;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.5);
            opacity: 0.7;
        }

        .year {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-green);
            margin: 0;
        }

        .event-title {
            font-size: 1.2rem;
            margin: 10px 0;
            min-height: 50px;
        }

        /* Probability Bar */
        .prob-wrapper {
            width: 100%;
            height: 10px;
            border: 1px solid var(--neon-blue);
            margin-top: 20px;
            position: relative;
        }

        .prob-bar {
            height: 100%;
            background: var(--neon-blue);
            width: 0%;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .glitch-text {
            animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); color: var(--glitch-red); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); color: var(--neon-blue); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

<div id="tiktok-canvas">
    <div class="scanner"></div>
    <div class="hud-corner top-left" id="coords">LAT: 31.95 | LONG: 35.91</div>
    <div class="hud-corner top-right">SYSTEM: ACTIVE <br> AI_PREDICT_v.4.0</div>
    <div class="hud-corner bottom-left" id="hex-data">DATA: 0x44F21</div>

    <canvas id="matrix-bg"></canvas>

    <div id="events-wrapper">
        <div class="event-container" id="ev1">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&q=80&w=400" alt="AI">
            </div>
            <p class="year">2029</p>
            <div class="event-title">AI PASSES TURING TEST</div>
            <div class="prob-wrapper"><div class="prob-bar" id="bar1"></div></div>
            <p style="font-size: 12px;">PROBABILITY: <span id="val1">0</span>%</p>
        </div>

        <div class="event-container" id="ev2">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?auto=format&fit=crop&q=80&w=400" alt="Mars">
            </div>
            <p class="year">2035</p>
            <div class="event-title">FIRST MARS COLONY</div>
            <div class="prob-wrapper"><div class="prob-bar" id="bar2"></div></div>
            <p style="font-size: 12px;">PROBABILITY: <span id="val2">0</span>%</p>
        </div>

        <div class="event-container" id="ev3">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1507413245164-6160d8298b31?auto=format&fit=crop&q=80&w=400" alt="Cyber">
            </div>
            <p class="year">2045</p>
            <div class="event-title">NEURALINK STANDARD INTEGRATION</div>
            <div class="prob-wrapper"><div class="prob-bar" id="bar3"></div></div>
            <p style="font-size: 12px;">PROBABILITY: <span id="val3">0</span>%</p>
        </div>
    </div>
</div>

<script>
    // Background Particles Effect
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function drawParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff41';
        for(let i=0; i<50; i++) {
            ctx.beginPath();
            ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 1, 0, Math.PI*2);
            ctx.fill();
        }
    }
    setInterval(drawParticles, 100);

    // Dynamic UI Updates
    setInterval(() => {
        document.getElementById('hex-data').innerText = 'DATA: ' + Math.random().toString(16).slice(2, 8).toUpperCase();
    }, 150);

    // GSAP Timeline for Events
    const tl = gsap.timeline({repeat: -1});
    const events = ['#ev1', '#ev2', '#ev3'];
    const probabilities = [98, 65, 82];

    events.forEach((ev, index) => {
        tl.to(ev, {display: 'block', duration: 0})
          .fromTo(ev, {opacity: 0, x: 20}, {opacity: 1, x: 0, duration: 0.5, ease: "power2.out"})
          .to(`#bar${index+1}`, {width: `${probabilities[index]}%`, duration: 1.5, ease: "power4.inOut"})
          .to(`#val${index+1}`, {
                innerText: probabilities[index],
                duration: 1.5,
                snap: {innerText: 1},
                onUpdate: function() { this.targets()[0].innerHTML = Math.ceil(this.targets()[0].innerText); }
          }, "<")
          .to(ev, {opacity: 0, x: -20, duration: 0.5, delay: 1.5})
          .to(ev, {display: 'none', duration: 0});
    });

</script>
</body>
</html>
